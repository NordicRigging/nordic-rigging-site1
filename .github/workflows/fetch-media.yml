# Dev utility: pulls public media URLs (e.g. Higgsfield generation results)
# listed in .github/media-request.txt into the orphan `media-inbox` branch so
# they can be fetched into a working copy that cannot reach the CDN directly.
# Never touches the site branches. Already-present files are skipped.
name: Fetch media

on:
  push:
    branches:
      - 'claude/**'
    paths:
      - '.github/media-request.txt'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download into media-inbox branch
        run: |
          set -euo pipefail
          cp .github/media-request.txt /tmp/request.txt
          git config user.name "media-relay"
          git config user.email "media-relay@users.noreply.github.com"
          if git fetch origin media-inbox 2>/dev/null; then
            git checkout -B media-inbox origin/media-inbox
          else
            git checkout --orphan media-inbox
            git rm -rf -q . || true
          fi
          mkdir -p inbox
          while read -r name url; do
            [ -z "$name" ] && continue
            case "$name" in \#*) continue;; esac
            if [ -s "inbox/$name" ]; then echo "skip $name (present)"; continue; fi
            echo "fetching $name"
            if curl -fsSL --retry 3 --retry-delay 2 -o "inbox/$name" "$url"; then
              ls -l "inbox/$name"
            else
              echo "FAILED $name"; rm -f "inbox/$name"
            fi
          done < /tmp/request.txt
          git add inbox
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "media inbox: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin media-inbox
