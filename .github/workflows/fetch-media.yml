# Dev utility: pulls public media URLs (e.g. Higgsfield generation results)
# into the orphan `media-inbox` branch so they can be fetched into a working
# copy that cannot reach the CDN directly. Never touches the site branches.
name: Fetch media

on:
  workflow_dispatch:
    inputs:
      files:
        description: 'Whitespace-separated name=url pairs'
        required: true
        type: string

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download into media-inbox branch
        env:
          FILES: ${{ inputs.files }}
        run: |
          set -euo pipefail
          git config user.name "media-relay"
          git config user.email "media-relay@users.noreply.github.com"
          if git fetch origin media-inbox 2>/dev/null; then
            git checkout -B media-inbox origin/media-inbox
          else
            git checkout --orphan media-inbox
            git rm -rf -q . || true
          fi
          mkdir -p inbox
          for pair in $FILES; do
            name="${pair%%=*}"
            url="${pair#*=}"
            echo "fetching $name"
            curl -fsSL --retry 3 --retry-delay 2 -o "inbox/$name" "$url"
            ls -l "inbox/$name"
          done
          git add inbox
          git commit -m "media inbox: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin media-inbox
